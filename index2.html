<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adaptive Multi-Timezone Planner</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#6b7280;--border:#dfe4ec;--accent:#2563eb;--now:#dc2626;--guide:#2563eb;--time-col:160px;--gantt-col:520px;--note-col:280px;--font-size:13px;--slot-h:5px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--font-size)}button,input,select,textarea{font:inherit}.app{max-width:1600px;margin:0 auto;padding:16px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}h1{font-size:22px;margin:0 0 6px}.sub{color:var(--muted);font-size:12px;line-height:1.55}.now-status{margin-top:7px;font-weight:700;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.filebtn{min-height:38px;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:#b42318}button:disabled{opacity:.45;cursor:not-allowed}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}.settings{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}.settings.show{display:block}.settings-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;align-items:end}label{display:block;font-size:12px;color:var(--muted)}input,select,textarea{width:100%;margin-top:5px;border:1px solid var(--border);border-radius:8px;padding:8px 9px;background:#fff;color:var(--text);min-height:38px}textarea{min-height:38px;resize:vertical}.checks{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}.checks label{display:flex;align-items:center;gap:5px;color:var(--text);font-size:12px}.checks input{width:auto;min-height:0;margin:0}.palette{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.swatch{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}.swatch.active{border-color:#111827}.form-grid{display:grid;grid-template-columns:1.1fr .7fr .8fr 1fr 1fr 1.3fr auto auto;gap:9px;align-items:end}.helper{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.5}.timeline-shell{position:relative;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px;max-height:74vh;margin-top:12px}.timeline{min-width:max-content;position:relative}.head{position:sticky;top:0;z-index:100;display:grid;background:#f8fafc;border-bottom:1px solid #c5ced8}.head>div{padding:10px 11px;border-right:1px solid var(--border);font-weight:700}.head small{display:block;color:var(--muted);font-weight:500;margin-top:2px;font-size:11px}.body{position:relative;display:grid;background:#fff}.col{position:relative;border-right:1px solid var(--border)}.gantt{background:rgba(37,99,235,.015)}.notes{background:#fcfcfd}.major,.dayline{position:absolute;left:0;right:0;height:0;pointer-events:none}.major{border-top:1px solid #eef1f5;z-index:2}.dayline{border-top:1px solid #c8d0db;z-index:3}.dayband{position:absolute;left:0;right:0;height:24px;background:rgba(23,32,51,.022);z-index:1;pointer-events:none}.tick{position:absolute;left:8px;transform:translateY(-50%);font-size:11px;color:var(--muted);z-index:8;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}.tick.day{transform:none;font-weight:750;color:var(--text);padding-top:5px;font-size:12px}.task-lane{position:absolute;left:8px;right:8px;display:flex;gap:4px;z-index:20}.task{min-width:0;flex:1;border-radius:7px;border:1px solid rgba(0,0,0,.06);padding:5px 7px;overflow:hidden;cursor:pointer;user-select:none;touch-action:manipulation}.task strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task small{display:block;color:#4b5563;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task.selected{outline:2px solid var(--accent);outline-offset:1px}.note-block{position:absolute;left:8px;right:8px;padding:5px 7px;border:1px dashed #ccd3de;border-radius:6px;background:#fff;color:#4b5563;overflow:hidden;z-index:15;cursor:pointer}.guide{position:absolute;left:0;right:0;border-top:2px solid var(--guide);z-index:70;display:none;pointer-events:none}.guide.now{border-top-color:var(--now)}.guide-label{position:absolute;transform:translateY(-50%);z-index:75;background:var(--guide);color:#fff;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:750;white-space:nowrap;display:none;pointer-events:none}.guide-label.now{background:var(--now)}.info{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.info.show{display:grid}.info>div{border:1px solid var(--border);border-radius:8px;padding:8px;background:#fff}.info strong{display:block;margin-bottom:3px}.save-state{font-size:11px;color:var(--muted);margin-left:4px}.mobile-tabs{display:none;gap:6px;margin-top:8px;overflow:auto}.mobile-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:1100px){.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid .wide{grid-column:1/-1}}
@media(max-width:700px){.app{padding:10px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.settings-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.mobile-tabs{display:flex}.head,.body{grid-template-columns:1fr!important}.head>div,.col{display:none}.head>div.mobile-active,.col.mobile-active{display:block}.timeline{min-width:100%}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><h1>多时区甘特时间规划表</h1><div class="sub">范围：2026/09/21–10/05。北京、檀香山、日本三时区全程可见；日程仅通过表单输入创建/修改，不支持拖拽改时间。时间精度为1分钟。</div><div id="nowStatus" class="now-status"></div></div><div class="actions"><button id="settingsBtn">⚙️ 页面设置</button><button id="savePlan" class="primary">保存计划</button><button id="backup">备份 JSON</button><label class="filebtn">导入 JSON<input id="restore" type="file" accept=".json" hidden></label></div></div>
<div class="card"><div class="toolbar"><label class="wide">点击横线定位<select id="clickMode"><option value="on">开启：点击时间区/甘特区生成横线</option><option value="off">关闭</option></select></label><label>时间刻度<select id="tickHours"><option value="3">每3小时</option><option value="6" selected>每6小时</option><option value="12">每12小时</option></select></label><label>时间精度<select disabled><option>1分钟</option></select></label><label>当前计划<div><span id="saveState" class="save-state">未修改</span></div></label><button id="clearGuide">清除点击横线</button></div><div id="settings" class="settings"><div class="settings-grid"><label>甘特图列宽(px)<input id="ganttWidth" type="number" min="280" max="1200" step="20" value="520"></label><label>备注列宽(px)<input id="noteWidth" type="number" min="180" max="800" step="20" value="280"></label><label>时间列宽(px)<input id="timeWidth" type="number" min="110" max="300" step="10" value="160"></label><label>字体大小(px)<input id="fontSize" type="number" min="11" max="20" step="1" value="13"></label><label>视觉缩放：每15分钟高度(px)<input id="slotHeight" type="number" min="3" max="12" step="1" value="5"></label></div><div class="checks"><label><input id="showBJ" type="checkbox" checked> 北京时间</label><label><input id="showHN" type="checkbox" checked> 檀香山时间</label><label><input id="showTK" type="checkbox" checked> 东京时间</label></div></div></div>
<div class="card"><form id="form" class="form-grid"><label class="wide">日程名称<input id="name" maxlength="80" placeholder="例如：论文修改 / Flight / Meeting"></label><label>输入时区<select id="inputZone"><option value="Asia/Shanghai">北京时间</option><option value="Pacific/Honolulu">檀香山时间</option><option value="Asia/Tokyo">东京时间</option></select></label><label>颜色<select id="colorName"><option value="blue">雾蓝</option><option value="green">灰绿</option><option value="sand">沙金</option><option value="lavender">薰衣草</option><option value="rose">灰粉</option><option value="slate">灰蓝</option></select></label><label>开始时间<input id="start" type="datetime-local" step="60" required></label><label>结束时间<input id="end" type="datetime-local" step="60" required></label><label class="wide">备注<textarea id="memo" placeholder="第五列显示"></textarea></label><button id="submitBtn" class="primary" type="submit">添加日程</button><button id="deleteBtn" class="danger" type="button" disabled>删除</button></form><div class="palette" id="palette"></div><div class="helper">同一时间可以有多个日程；它们会自动平均分配甘特列宽。桌面端直接显示多列；手机端会切换成单列标签页。长按日程块进入编辑/删除，普通点击只显示对齐横线。</div><div id="info" class="info"><div><strong>北京时间</strong><span id="ibj"></span></div><div><strong>檀香山时间</strong><span id="ihn"></span></div><div><strong>东京时间</strong><span id="itk"></span></div></div></div>
<div id="mobileTabs" class="mobile-tabs"><button data-tab="bj">北京</button><button data-tab="hn">檀香山</button><button data-tab="tk">东京</button><button data-tab="gantt" class="active">甘特</button><button data-tab="notes">备注</button></div>
<div id="shell" class="timeline-shell"><div id="timeline" class="timeline"><div id="head" class="head"></div><div id="body" class="body"><div id="bj" class="col"></div><div id="hn" class="col"></div><div id="tk" class="col"></div><div id="gantt" class="col gantt"></div><div id="notes" class="col notes"></div><div id="clickGuide" class="guide"></div><div id="nowGuide" class="guide now"></div></div></div></div>
</div>
<script>
(()=>{
const START=new Date("2026-09-21T00:00:00+08:00"),END=new Date("2026-10-06T00:00:00+08:00"),PRECISION=60*1000,VISUAL_SLOT=15*60*1000,KEY="adaptive_tz_planner_v1";
const zones=[{id:"bj",label:"北京时间",tz:"Asia/Shanghai"},{id:"hn",label:"檀香山时间",tz:"Pacific/Honolulu"},{id:"tk",label:"东京时间",tz:"Asia/Tokyo"}];
const colors={blue:{bg:"#dbe7f1",border:"#7f9db6"},green:{bg:"#dde9df",border:"#86a28b"},sand:{bg:"#eee5cf",border:"#b7a06a"},lavender:{bg:"#e8e0ef",border:"#9c88ac"},rose:{bg:"#eedfe2",border:"#b58a93"},slate:{bg:"#dfe5ea",border:"#82909e"}};
let state={tasks:[],selected:null,settings:{ganttWidth:520,noteWidth:280,timeWidth:160,fontSize:13,slotHeight:5,showBJ:true,showHN:true,showTK:true,tickHours:6,clickMode:"on"},savedAt:null};
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&Array.isArray(x.tasks))state={...state,...x,settings:{...state.settings,...x.settings}}}catch(e){}
const $=s=>document.querySelector(s),body=$("#body"),head=$("#head"),shell=$("#shell"),gantt=$("#gantt"),notes=$("#notes");
const saveLocal=()=>localStorage.setItem(KEY,JSON.stringify(state));
function parts(d,tz){const o={};new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value});if(o.hour==="24")o.hour="00";return o}
function fmt(d,tz){const p=parts(d,tz);return `${p.month}/${p.day} ${p.hour}:${p.minute}`}
function inputVal(d,tz){const p=parts(d,tz);return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`}
function offsetMsAt(date,tz){const p=parts(date,tz),asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,0);return asUTC-date.getTime()}
function localInputToDate(v,tz){if(!v)return null;const [dp,tp]=v.split("T"),[Y,M,D]=dp.split("-").map(Number),[h,m]=tp.split(":").map(Number);let guess=new Date(Date.UTC(Y,M-1,D,h,m));for(let i=0;i<3;i++){const off=offsetMsAt(guess,tz);guess=new Date(Date.UTC(Y,M-1,D,h,m)-off)}return guess}
function snap(d){return new Date(START.getTime()+Math.round((d-START)/PRECISION)*PRECISION)}
const slotH=()=>+state.settings.slotHeight,y=d=>((d-START)/VISUAL_SLOT)*slotH(),totalH=()=>((END-START)/VISUAL_SLOT)*slotH();
function activeZones(){return zones.filter(z=>z.id==="bj"?state.settings.showBJ:z.id==="hn"?state.settings.showHN:state.settings.showTK)}
function colTemplate(){return [...activeZones().map(()=>`${state.settings.timeWidth}px`),`${state.settings.ganttWidth}px`,`${state.settings.noteWidth}px`].join(" ")}
function setDirty(){$("#saveState").textContent="有未保存更改"}
function renderPalette(){const p=$("#palette");p.innerHTML="";Object.entries(colors).forEach(([k,c])=>{const b=document.createElement("button");b.type="button";b.className="swatch"+($("#colorName").value===k?" active":"");b.style.background=c.bg;b.title=k;b.onclick=()=>{$("#colorName").value=k;renderPalette()};p.appendChild(b)})}
function applySettings(){document.documentElement.style.setProperty("--font-size",state.settings.fontSize+"px");$("#ganttWidth").value=state.settings.ganttWidth;$("#noteWidth").value=state.settings.noteWidth;$("#timeWidth").value=state.settings.timeWidth;$("#fontSize").value=state.settings.fontSize;$("#slotHeight").value=state.settings.slotHeight;$("#showBJ").checked=state.settings.showBJ;$("#showHN").checked=state.settings.showHN;$("#showTK").checked=state.settings.showTK;$("#tickHours").value=state.settings.tickHours;$("#clickMode").value=state.settings.clickMode;renderStructure();renderTasks();updateNow()}
function renderStructure(){const az=activeZones(),template=colTemplate();head.style.gridTemplateColumns=template;body.style.gridTemplateColumns=template;head.innerHTML="";az.forEach(z=>{const d=document.createElement("div");d.dataset.col=z.id;d.innerHTML=`${z.label}<small>09/21–10/05</small>`;head.appendChild(d)});const gd=document.createElement("div");gd.dataset.col="gantt";gd.innerHTML='甘特日程<small>点击显示横线 · 长按编辑</small>';head.appendChild(gd);const nd=document.createElement("div");nd.dataset.col="notes";nd.innerHTML='备注<small>与日程纵向对齐</small>';head.appendChild(nd);zones.forEach(z=>$("#"+z.id).style.display=az.some(a=>a.id===z.id)?"block":"none");[body,...zones.map(z=>$("#"+z.id)),gantt,notes].forEach(el=>el.style.height=totalH()+"px");renderRulers();applyMobileTab(currentTab)}
function renderRulers(){zones.forEach(z=>$("#"+z.id).innerHTML="");[...body.querySelectorAll(".major,.dayline,.dayband")].forEach(n=>n.remove());const step=+state.settings.tickHours;for(let h=0;h<=15*24;h+=step){const d=new Date(START.getTime()+h*3600000),yy=y(d),isDay=h%24===0,l=document.createElement("div");l.className=isDay?"dayline":"major";l.style.top=yy+"px";body.appendChild(l);if(isDay&&h<15*24){const b=document.createElement("div");b.className="dayband";b.style.top=yy+"px";body.appendChild(b)}}zones.forEach(z=>{const col=$("#"+z.id);for(let h=0;h<=15*24;h+=step){const d=new Date(START.getTime()+h*3600000),p=parts(d,z.tz),hh=+p.hour,t=document.createElement("div");t.className="tick"+(hh===0?" day":"");t.style.top=(y(d)+(hh===0?1:0))+"px";t.textContent=hh===0?`${p.month}/${p.day}  00:00`:`${p.hour}:00`;col.appendChild(t)}})}
function computeConcurrency(){const tasks=[...state.tasks].sort((a,b)=>+new Date(a.start)-+new Date(b.start));return tasks.map(t=>{const s=+new Date(t.start),e=+new Date(t.end),over=tasks.filter(o=>+new Date(o.start)<e&&+new Date(o.end)>s),index=over.findIndex(o=>o.id===t.id);return{t,count:over.length,index:Math.max(index,0)}})}
function renderTasks(){gantt.innerHTML="";notes.innerHTML="";computeConcurrency().forEach(({t,count,index})=>{const a=new Date(t.start),b=new Date(t.end),top=y(a),h=Math.max(14,y(b)-top),c=colors[t.color]||colors.blue,w=100/count,left=index*w;const el=document.createElement("div");el.className="task"+(t.id===state.selected?" selected":"");el.style.position="absolute";el.style.top=top+"px";el.style.height=h+"px";el.style.left=`calc(${left}% + 8px)`;el.style.width=`calc(${w}% - 12px)`;el.style.background=c.bg;el.style.borderLeft=`4px solid ${c.border}`;el.innerHTML="<strong></strong><small></small>";el.querySelector("strong").textContent=t.name;el.querySelector("small").textContent=`${fmt(a,"Asia/Shanghai")} → ${fmt(b,"Asia/Shanghai")}`;attachPress(el,t);gantt.appendChild(el);const n=document.createElement("div");n.className="note-block";n.style.top=top+"px";n.style.height=Math.max(18,h)+"px";n.textContent=t.note||"—";attachPress(n,t);notes.appendChild(n)})}
function attachPress(el,t){let timer=null,long=false;const startPress=()=>{long=false;timer=setTimeout(()=>{long=true;editTask(t.id)},650)},cancel=()=>{if(timer)clearTimeout(timer)};el.addEventListener("pointerdown",startPress);["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,cancel));el.addEventListener("click",e=>{e.stopPropagation();if(!long)showTaskGuide(t)})}
function showTaskGuide(t){state.selected=t.id;renderTasks();const a=new Date(t.start),b=new Date(t.end);showGuide(a);showInfo(a,b)}
function showInfo(a,b){$("#info").classList.add("show");$("#ibj").textContent=`${fmt(a,"Asia/Shanghai")} → ${fmt(b,"Asia/Shanghai")}`;$("#ihn").textContent=`${fmt(a,"Pacific/Honolulu")} → ${fmt(b,"Pacific/Honolulu")}`;$("#itk").textContent=`${fmt(a,"Asia/Tokyo")} → ${fmt(b,"Asia/Tokyo")}`}
function showGuide(d){const g=$("#clickGuide");g.style.top=y(d)+"px";g.style.display="block";[...body.querySelectorAll(".guide-label.click")].forEach(x=>x.remove());let left=0;activeZones().forEach(z=>{const lab=document.createElement("div");lab.className="guide-label click";lab.style.left=(left+8)+"px";lab.style.top=y(d)+"px";lab.style.display="block";lab.textContent=fmt(d,z.tz);body.appendChild(lab);left+=state.settings.timeWidth})}
function clearGuide(){$("#clickGuide").style.display="none";[...body.querySelectorAll(".guide-label.click")].forEach(x=>x.remove());$("#info").classList.remove("show")}
function editTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;state.selected=id;$("#name").value=t.name;$("#inputZone").value=t.inputZone||"Asia/Shanghai";$("#colorName").value=t.color||"blue";$("#memo").value=t.note||"";const z=$("#inputZone").value;$("#start").value=inputVal(new Date(t.start),z);$("#end").value=inputVal(new Date(t.end),z);$("#submitBtn").textContent="更新日程";$("#deleteBtn").disabled=false;renderPalette();renderTasks()}
function resetForm(){state.selected=null;$("#name").value="";$("#memo").value="";$("#submitBtn").textContent="添加日程";$("#deleteBtn").disabled=true;renderTasks()}
$("#form").addEventListener("submit",e=>{e.preventDefault();const z=$("#inputZone").value;let a=localInputToDate($("#start").value,z),b=localInputToDate($("#end").value,z);if(!a||!b)return alert("请填写开始和结束时间");a=snap(a);b=snap(b);if(!(a<b))return alert("结束时间必须晚于开始时间");if(a<START||b>END)return alert("转换到北京时间后，日程必须位于 2026/09/21–10/05 范围内");const t={id:state.selected||Date.now()+"_"+Math.random().toString(36).slice(2),name:$("#name").value.trim()||"未命名日程",inputZone:z,color:$("#colorName").value,start:a.toISOString(),end:b.toISOString(),note:$("#memo").value.trim()};if(state.selected){const i=state.tasks.findIndex(x=>x.id===state.selected);if(i>=0)state.tasks[i]=t}else state.tasks.push(t);state.selected=t.id;saveLocal();setDirty();showTaskGuide(t);resetForm();renderTasks()});
$("#deleteBtn").onclick=()=>{if(!state.selected)return;const t=state.tasks.find(x=>x.id===state.selected);if(t&&confirm(`删除「${t.name}」？`)){state.tasks=state.tasks.filter(x=>x.id!==state.selected);saveLocal();setDirty();resetForm()}};
$("#inputZone").onchange=()=>{if(!state.selected)return;const t=state.tasks.find(x=>x.id===state.selected);if(!t)return;const z=$("#inputZone").value;$("#start").value=inputVal(new Date(t.start),z);$("#end").value=inputVal(new Date(t.end),z)};$("#colorName").onchange=renderPalette;
$("#settingsBtn").onclick=()=>$("#settings").classList.toggle("show");
["ganttWidth","noteWidth","timeWidth","fontSize","slotHeight"].forEach(id=>$("#"+id).onchange=()=>{state.settings[id]=+$("#"+id).value;saveLocal();setDirty();applySettings()});
[["showBJ","showBJ"],["showHN","showHN"],["showTK","showTK"]].forEach(([id,k])=>$("#"+id).onchange=()=>{if(!$("#showBJ").checked&&!$("#showHN").checked&&!$("#showTK").checked){$("#"+id).checked=true;return alert("至少保留一个时区")};state.settings[k]=$("#"+id).checked;saveLocal();setDirty();applySettings()});
$("#tickHours").onchange=()=>{state.settings.tickHours=+$("#tickHours").value;saveLocal();setDirty();applySettings()};$("#clickMode").onchange=()=>{state.settings.clickMode=$("#clickMode").value;saveLocal();setDirty()};$("#clearGuide").onclick=clearGuide;
body.addEventListener("click",e=>{if(state.settings.clickMode!=="on"||e.target.closest(".task,.note-block"))return;const r=body.getBoundingClientRect(),yy=e.clientY-r.top,d=new Date(START.getTime()+Math.max(0,Math.min(END-START,Math.round(((yy/slotH())*VISUAL_SLOT)/PRECISION)*PRECISION)));showGuide(d);$("#info").classList.add("show");$("#ibj").textContent=fmt(d,"Asia/Shanghai");$("#ihn").textContent=fmt(d,"Pacific/Honolulu");$("#itk").textContent=fmt(d,"Asia/Tokyo")});
function updateNow(){const n=new Date();$("#nowStatus").textContent=`现在：北京 ${fmt(n,"Asia/Shanghai")} · 檀香山 ${fmt(n,"Pacific/Honolulu")} · 东京 ${fmt(n,"Asia/Tokyo")}`;const g=$("#nowGuide");[...body.querySelectorAll(".guide-label.now")].forEach(x=>x.remove());if(n>=START&&n<END){g.style.top=y(n)+"px";g.style.display="block";let left=0;activeZones().forEach(z=>{const lab=document.createElement("div");lab.className="guide-label now";lab.style.left=(left+8)+"px";lab.style.top=y(n)+"px";lab.style.display="block";lab.textContent=fmt(n,z.tz);body.appendChild(lab);left+=state.settings.timeWidth})}else g.style.display="none"}
$("#savePlan").onclick=()=>{state.savedAt=new Date().toISOString();saveLocal();$("#saveState").textContent="已保存 "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
$("#backup").onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="time_planner_backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),600)};
$("#restore").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.tasks))throw 0;state={...state,...x,settings:{...state.settings,...x.settings}};saveLocal();applySettings();renderTasks();$("#saveState").textContent="已导入"}catch(_){alert("JSON 文件格式不正确")}e.target.value=""};
let currentTab="gantt";function applyMobileTab(tab){currentTab=tab;if(window.innerWidth>700)return;["bj","hn","tk","gantt","notes"].forEach(id=>{const col=$("#"+id);if(col)col.classList.toggle("mobile-active",id===tab);const hd=[...head.children].find(x=>x.dataset.col===id);if(hd)hd.classList.toggle("mobile-active",id===tab)});[...document.querySelectorAll("#mobileTabs button")].forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
[...document.querySelectorAll("#mobileTabs button")].forEach(b=>b.onclick=()=>applyMobileTab(b.dataset.tab));window.addEventListener("resize",()=>applyMobileTab(currentTab));
renderPalette();applySettings();renderTasks();updateNow();setInterval(updateNow,30000);if(state.savedAt)$("#saveState").textContent="上次保存 "+new Date(state.savedAt).toLocaleString();
})();
</script>
</body></html>
